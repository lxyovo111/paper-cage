<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸上牢笼</title>
<script src="//g.alicdn.com/code/lib/iframe-resizer/4.3.2/iframeResizer.contentWindow.min.js"></script>
<style>
:root{
  --ink:#221d19; --ink2:#40372d; --muted:#7e6f5c; --red:#882e1f; --redd:#9c3626;
  --paper:#e8dcc0; --warm:#80603c; --kai:'LXGW WenKai','KaiTi','STKaiti','Songti SC',serif;
  --song:'Songti SC','SimSun','Noto Serif CJK SC',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14110e}
body{
  display:grid;place-items:center;
  background:
    radial-gradient(120% 90% at 50% 8%, #2a231b 0%, #171310 55%, #0d0b09 100%);
  font-family:var(--song); color:var(--ink2);
  -webkit-font-smoothing:antialiased;
}
#desk{width:100%;height:100%;display:grid;place-items:center;padding:0}
#stage{
  position:relative;
  width:min(100vw, 160vh, 1760px);
  aspect-ratio:16/10;
  box-shadow:0 24px 70px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  background:#e8dcc0;
  overflow:hidden;
}
#screen, #screen svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#screen svg text{ -webkit-user-select:none; user-select:none }

/* ---------- 夜间：路径描画 ---------- */
#nightpath path.trail{
  fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:6 5; opacity:0;
  animation:drawTrail 2.4s ease-out .25s forwards;
}
#nightpath .dot{opacity:0;animation:fadeIn .3s ease-out 2.4s forwards}
@keyframes drawTrail{ from{opacity:0;stroke-dashoffset:600} to{opacity:.85;stroke-dashoffset:0} }
@keyframes fadeIn{ to{opacity:1} }
.nightfade{animation:nightfade 3.2s ease-in-out forwards}
@keyframes nightfade{ from{opacity:0} to{opacity:1} }

/* ---------- 覆盖层 ---------- */
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay > *{pointer-events:auto}
.scrim{
  position:absolute;inset:0;background:rgba(20,16,11,.42);
  display:grid;place-items:center;animation:scrimIn .22s ease-out;
  backdrop-filter:blur(1.5px);
}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:relative;width:min(560px, 74%);padding:34px 38px 28px;
  background:linear-gradient(180deg,#f0e6d0,#e6d8b9);
  box-shadow:0 22px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(90,70,40,.35) inset, 0 0 0 6px rgba(255,255,255,.25) inset;
  animation:sheetIn .26s cubic-bezier(.2,.9,.3,1);
  color:var(--ink);
}
.sheet:before{
  content:'';position:absolute;inset:6px;border:1px solid rgba(90,70,40,.35);pointer-events:none;
}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.sheet h3{margin:0 0 6px;font-weight:400;font-size:20px;letter-spacing:4px;color:var(--ink)}
.sheet .sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.sheet textarea{
  width:100%;height:88px;resize:none;padding:12px 14px;font-family:var(--kai);
  font-size:19px;line-height:1.5;color:var(--ink);background:rgba(255,255,255,.25);
  border:1px solid rgba(90,70,40,.4);border-radius:0;outline:none;
}
.sheet textarea:focus{border-color:var(--red);background:rgba(255,255,255,.42)}
.sheet textarea::placeholder{color:#a3937a}
.hint{margin:8px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:1px}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.examples span{
  font-family:var(--kai);font-size:13px;color:#5a4c3a;padding:5px 10px;cursor:pointer;
  border:1px dashed rgba(90,70,40,.4);transition:all .15s;
}
.examples span:hover{background:rgba(255,255,255,.4);color:var(--ink);border-style:solid}
.row{display:flex;gap:12px;justify-content:flex-end;margin-top:22px;align-items:center}
.btn{
  font-family:var(--song);font-size:14px;letter-spacing:3px;padding:9px 20px;cursor:pointer;
  background:transparent;border:1px solid rgba(90,70,40,.5);color:var(--ink2);transition:all .15s;
}
.btn:hover{background:rgba(255,255,255,.35)}
.btn.primary{border-color:var(--redd);color:var(--red);background:rgba(136,46,31,.05)}
.btn.primary:hover{background:rgba(136,46,31,.12)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.4;pointer-events:none}
/* 编译结果回显 */
.verdict{margin:6px 0 0;padding:14px 16px;background:rgba(128,96,60,.08);border-left:2px solid var(--warm)}
.verdict .q{font-family:var(--kai);font-size:19px;color:var(--ink);line-height:1.5}
.verdict .n{margin-top:10px;font-size:11.5px;color:var(--warm);letter-spacing:1px}
.verdict .n b{font-weight:400;color:var(--red)}
.ai-pend{margin-top:6px;font-size:11px;letter-spacing:1px;color:#9c8e78;animation:pendblink 1.6s ease-in-out infinite}
@keyframes pendblink{0%,100%{opacity:.45}50%{opacity:.9}}
.ai-tag{margin-left:8px;padding:1px 6px;border:1px solid rgba(136,46,31,.45);color:var(--red);font-size:10px;letter-spacing:1px;vertical-align:1px}
/* 预判 */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.chip{
  display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
  border:1px solid rgba(90,70,40,.32);background:rgba(255,255,255,.18);transition:all .15s;
}
.chip:hover{background:rgba(255,255,255,.45);border-color:rgba(136,46,31,.5)}
.chip .nm{font-family:var(--kai);font-size:16px;color:var(--ink)}
.chip .in{font-size:11px;color:var(--muted)}
/* 结算 */
.settle{text-align:center;padding:46px 46px 34px}
.settle .t{font-family:var(--kai);font-size:44px;letter-spacing:14px;color:var(--red);margin:0}
.settle .s{margin:10px 0 0;font-size:14px;color:var(--ink2);letter-spacing:2px}
.settle .rule-line{margin:26px 0 0;font-size:10px;color:var(--muted);letter-spacing:6px}
.settle .quote{
  margin:14px auto 0;max-width:420px;font-family:var(--kai);font-size:17px;line-height:1.85;color:var(--ink);
}
.settle .stats{display:flex;gap:26px;justify-content:center;margin-top:24px;font-size:11.5px;color:var(--muted);letter-spacing:2px}
.settle .stats b{display:block;font-size:19px;font-family:var(--kai);font-weight:400;color:var(--ink2);letter-spacing:1px;margin-top:4px}
.loading{font-size:12px;color:var(--muted);letter-spacing:3px}
.loading:after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'·'}50%{content:'··'}75%{content:'···'}}
@media (max-width:760px){
  .sheet{width:88%;padding:24px 22px 20px}
  .sheet h3{font-size:17px}
  .sheet textarea{font-size:17px;height:76px}
  .settle{padding:32px 22px 24px}
  .settle .t{font-size:32px;letter-spacing:8px}
  .chips{grid-template-columns:1fr}
}

/* ---- 夜：路径逐段画出，人物小像沿路径移动 ---- */
@keyframes npdraw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
#np { animation: npdraw 2s linear forwards; }
@keyframes tokIn { to { opacity: 1 } }
.nptok { opacity: 0; animation: tokIn .45s .1s forwards; }
svg.night #token-prisoner { opacity: 0; }
.nptok { filter: brightness(.62) saturate(.75) sepia(.14); }

/* ---------- 手机竖屏：纵向版式（不是缩放，是重排） ---------- */
@media (max-width: 900px) and (orientation: portrait) {
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; }
  #desk { display: grid; place-items: center; width: 100%; height: 100%; padding: 0; }
  #stage { width: min(100%, calc(100dvh * 800 / 1840)); aspect-ratio: 800 / 1840; height: auto; max-height: 100%; box-shadow: none; }
  #stage.settle-stage { width: min(100%, calc(100dvh * 800 / 1500)); aspect-ratio: 800 / 1500; }
  .scrim { position: fixed; inset: 0; z-index: 20; padding: 12px; }
  .sheet { width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; padding: 22px 20px 18px; box-shadow: 0 18px 44px rgba(0,0,0,.55), 0 0 0 1px rgba(90,70,40,.35) inset; }
  .sheet h3 { font-size: 18px; letter-spacing: 3px; }
  .sheet .sub { font-size: 12px; letter-spacing: 1px; margin-bottom: 14px; }
  .sheet textarea { height: 72px; font-size: 17px; padding: 10px 12px; }
  .hint { font-size: 11px; }
  .examples span { font-size: 12px; padding: 5px 8px; }
  .row { margin-top: 16px; gap: 10px; }
  .row.stack { flex-direction: column; align-items: stretch; }
  .row.stack .btn { width: 100%; }
  .btn { padding: 9px 16px; font-size: 13.5px; letter-spacing: 2px; }
  .verdict .q { font-size: 17px; }
  .verdict .n { font-size: 12px; }
  .chips { grid-template-columns: 1fr; gap: 8px; }
  .chip { padding: 11px 12px; }
  .chip .nm { font-size: 16px; }
  .chip .in { font-size: 11.5px; }
  .settle { padding: 26px 18px 20px; }
  .settle .t { font-size: 34px; letter-spacing: 8px; }
  .settle .s { font-size: 13px; }
  .settle .quote { font-size: 15px; max-width: 100%; }
  .settle .stats { gap: 18px; font-size: 11px; }
  #toast { position: fixed !important; bottom: 12px !important; left: 50% !important; }
}

/* 进入界面（封面）：红章是唯一按钮，悬停时给一点呼吸 */
svg.intro { display: block; width: 100%; height: 100%; }
.cover-seal { transition: opacity .18s ease; }
.cover-seal:hover { opacity: .82; }
.cover-seal:active { opacity: .68; }

/* 声音开关：贴在舞台左上角，不随 SVG 重绘丢失 */
#mute-btn { position: absolute; left: 1.6%; top: 3.2%; z-index: 30; width: 30px; height: 30px;
  border-radius: 50%; border: 1px solid rgba(232,220,192,.35); background: rgba(26,21,18,.55);
  color: #e8dcc0; font-family: var(--song); font-size: 13px; line-height: 1; cursor: pointer;
  opacity: .6; transition: opacity .2s, background .2s; padding: 0; }
#mute-btn:hover { opacity: 1; }
#mute-btn.muted { color: #9c8e78; background: rgba(26,21,18,.3); }
@media (max-width: 900px) and (orientation: portrait) {
  #mute-btn { width: 22px; height: 22px; left: 1.2%; top: 12.2%; font-size: 10px; opacity: .4; }
}
</style>
</head>
<body>
<div id="desk"><div id="stage"><div id="screen"></div><div id="overlay"></div></div></div>
<script>
(function(){
const M = {};
/* ===== ui/paper.js ===== */
(function(){
// paper.js — 纸、墨、印章的视觉层。全部是 SVG 滤镜与纹理，不依赖图片。
const C = {
  INK:'#221d19', INK2:'#40372d', MUTED:'#7e6f5c', MUT2:'#9c8e78',
  RED:'#882e1f', REDD:'#9c3626', PAPER:'#e8dcc0', PAPER_HI:'#efe6d2',
  WARM:'#80603c', BRASS:'#544a3c', STEEL:'#303a46', PENCIL:'#5c5850',
};
const KAI = "'LXGW WenKai','KaiTi','STKaiti','Songti SC','Noto Serif CJK SC',serif";
const SONG = "'Songti SC','SimSun','Noto Serif CJK SC',serif";

function buildDefs() {
  return `
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <filter id="blotch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.24" intercept="-0.08"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="vign" cx="50%" cy="45%" r="72%">
      <stop offset="48%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2c1c" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="edgeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f22" stop-opacity="0.10"/>
      <stop offset="6%" stop-color="#000" stop-opacity="0"/>
      <stop offset="94%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a2f22" stop-opacity="0.13"/>
    </linearGradient>
  </defs>`;
}

function buildPaper(w = 1600, h = 1000) {
  const stains = [
    [1288, 214, 62, 40, 0.10], [402, 640, 90, 54, 0.09], [980, 864, 74, 44, 0.10],
    [214, 302, 48, 34, 0.07], [742, 128, 40, 26, 0.06], [1360, 720, 56, 38, 0.08],
  ].map(function (s) { return '<ellipse cx="' + s[0] + '" cy="' + s[1] + '" rx="' + s[2] + '" ry="' + s[3] + '" fill="#8a6a3e" opacity="' + s[4] + '" filter="url(#soft)"/>'; }).join('');
  const fibers = [];
  for (let i = 0; i < 26; i++) {
    const x = 60 + ((i * 617) % 1480), y = 40 + ((i * 421) % 920), a = (i * 37) % 180;
    fibers.push('<line x1="' + x + '" y1="' + y + '" x2="' + (x + Math.cos(a) * 46).toFixed(1) + '" y2="' + (y + Math.sin(a) * 9).toFixed(1) + '" stroke="#8a7550" stroke-width="0.6" opacity="0.25"/>');
  }
  return `
  <g id="paper">
    <rect width="${w}" height="${h}" fill="${C.PAPER}"/>
    <rect width="${w}" height="${h}" fill="#b48d54" opacity="0.09" filter="url(#blotch)"/>
    <rect width="${w}" height="${h}" fill="#c8a060" opacity="0.06"/>
    ${stains}${fibers.join('')}
    <rect width="${w}" height="${h}" fill="url(#edgeShade)"/>
    <rect width="${w}" height="${h}" fill="url(#vign)"/>
    <rect width="${w}" height="${h}" filter="url(#grain)" opacity="0.5"/>
    <line x1="1006" y1="0" x2="1006" y2="${h}" stroke="#7a6a4e" stroke-width="1.4" opacity="0.15"/>
    <line x1="1012" y1="0" x2="1012" y2="${h}" stroke="#ffffff" stroke-width="1.2" opacity="0.20"/>
    <rect x="0.5" y="0.5" width="${w - 1}" height="${h - 1}" fill="none" stroke="#6b5a3e" stroke-width="1" opacity="0.35"/>
  </g>`;
}

function pencilCircle(cx, cy, rx, ry, rot) {
  rot = rot || 0;
  let d = '';
  for (let i = 0; i <= 56; i++) {
    const a = (Math.PI * 2 * i) / 56;
    const j = i % 2 ? 1.02 : 0.985;
    const x = Math.cos(a) * rx * j, y = Math.sin(a) * ry * j;
    const xr = x * Math.cos(rot) - y * Math.sin(rot), yr = x * Math.sin(rot) + y * Math.cos(rot);
    d += (i ? 'L' : 'M') + (cx + xr).toFixed(1) + ' ' + (cy + yr).toFixed(1);
  }
  return '<path d="' + d + 'Z" fill="none" stroke="' + C.PENCIL + '" stroke-width="1.1" opacity="0.5"/>';
}

M["paper"] = {C:C, KAI:KAI, SONG:SONG, buildDefs:buildDefs, buildPaper:buildPaper, pencilCircle:pencilCircle};
})();
/* ===== ui/intro.js ===== */
(function(){
// intro.js — 进入界面（封面）。桌面 1600x1000，手机竖屏 800x1840。
// 只负责「看起来怎样」：返回 SVG 字符串，不碰状态、不碰判定。
// 与外部唯一契约：输出里必须有一个 data-act="start" 的元素 —— 点它才开始新一局。
  const { C, KAI, SONG, buildDefs, buildPaper } = M["paper"];
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 一段文字：x/y 是基线；anchor=middle 时水平居中
function T(x, y, s, o) {
  o = o || {};
  const f = o.kai === false ? SONG : KAI;
  let a = `x="${x}" y="${y}" fill="${o.fill || C.INK}" font-family="${f}" font-size="${o.size || 14}"`;
  if (o.tracking) a += ` letter-spacing="${o.tracking}"`;
  if (o.anchor) a += ` text-anchor="${o.anchor}"`;
  if (o.opacity != null) a += ` opacity="${o.opacity}"`;
  return `<text ${a}>${esc(s)}</text>`;
}

function H(x1, y1, x2, y2, o) {
  o = o || {};
  const st = o.stroke || C.INK2;
  const op = o.opacity == null ? 0.35 : o.opacity;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st}" stroke-width="${o.w || 1}" opacity="${op}"/>`;
}

// 他走过的那条路：一条很淡的虚线，压在纸上像铅笔痕迹
function trail(pts, op) {
  const d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
  return `<path d="${d}" fill="none" stroke="${C.RED}" stroke-width="2" stroke-dasharray="10 12" opacity="${op}"/>`;
}

// 红章按钮：双线方框 + 两个字；点它 = 开始新一局
function seal(cx, cy, n, label, rot) {
  const half = n / 2;
  const inner = n - Math.max(10, n * 0.09);
  const chars = Array.from(label);
  const fs = n * (chars.length <= 2 ? 0.30 : 0.24);
  const gap = fs * 1.5;
  const body = chars.map(function (ch, i) {
    const dx = (i - (chars.length - 1) / 2) * gap;
    return T(dx, fs * 0.36, ch, { size: fs, fill: C.RED, anchor: "middle" });
  }).join("");
  const r = rot == null ? -8 : rot;
  return `<g class="cover-seal" data-act="start" style="cursor:pointer" role="button" aria-label="进入游戏">` +
    `<g transform="translate(${cx} ${cy}) rotate(${r})">` +
    `<rect x="${-half}" y="${-half}" width="${n}" height="${n}" fill="none" stroke="${C.RED}" stroke-width="${Math.max(3, n * 0.035)}" opacity="0.92"/>` +
    `<rect x="${-inner / 2}" y="${-inner / 2}" width="${inner}" height="${inner}" fill="none" stroke="${C.RED}" stroke-width="${Math.max(1.4, n * 0.014)}" opacity="0.72"/>` +
    body +
    `</g></g>`;
}

// 三条说明，桌面与手机共用文案
const LINES = [
  "你写一句人话，它被译成一条能执行的条件。",
  "他每晚只走一条缝；AI 替他挑，判定归引擎。",
  "七夜之后，是一张判决书。",
];

function renderIntro() {
  let s = `<svg class="intro" viewBox="0 0 1600 1000" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">`;
  s += buildDefs();
  s += buildPaper(1600, 1000);
  // 页眉
  s += T(132, 88, "案  卷", { size: 13, tracking: 2 });
  s += T(214, 88, "No.07 / 19", { size: 13, kai: false, tracking: 2, fill: C.INK2 });
  s += T(132, 112, "内部资料 · 尚未结案", { size: 12, fill: C.MUTED, tracking: 1 });
  s += T(1468, 88, "魔搭创空间 · AI 造游戏", { size: 11, fill: C.MUT2, tracking: 1, anchor: "end" });
  s += H(132, 170, 1468, 170, { opacity: 0.4 });
  // 一条很淡的路径，只在页面下半部绕行，不压标题
  s += trail([[132, 906], [300, 906], [300, 946], [1300, 946], [1300, 906], [1468, 906]], 0.07);
  // 标题区
  s += T(800, 258, "二 〇 二 六 · 冬", { size: 13, fill: C.MUT2, tracking: 6, anchor: "middle" });
  s += T(800, 440, "纸 上 牢 笼", { size: 152, tracking: 22, anchor: "middle" });
  s += H(650, 492, 950, 492, { opacity: 0.42, w: 1.2 });
  s += T(800, 566, "七天，最多六条规矩", { size: 38, anchor: "middle", tracking: 4 });
  s += T(800, 620, "关住一个每天夜里都在找漏洞的人", { size: 38, anchor: "middle", tracking: 2 });
  LINES.forEach(function (t, i) {
    s += T(800, 698 + i * 34, t, { size: 16, fill: C.MUTED, anchor: "middle", tracking: 1 });
  });
  // 红章 = 开始
  s += seal(800, 862, 134, "进入");
  s += T(800, 972, "点击红章开始 · 一局约 8 分钟", { size: 12, fill: C.MUT2, anchor: "middle", tracking: 2 });
  return s + "</svg>";
}

function renderIntroMobile() {
  let s = `<svg class="intro" viewBox="0 0 800 1840" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">`;
  s += buildDefs();
  s += buildPaper(800, 1840);
  s += T(36, 66, "案  卷", { size: 21, tracking: 3 });
  s += T(132, 66, "No.07 / 19", { size: 21, kai: false, tracking: 2, fill: C.INK2 });
  s += T(36, 100, "内部资料 · 尚未结案", { size: 17, fill: C.MUTED, tracking: 1 });
  s += H(36, 132, 764, 132, { opacity: 0.4 });

(function(){
// audio.js — 音频层：两条 BGM 交叉淡入 + 事件音效。首次用户操作后才启动（浏览器自动播放限制）。
// 文件放创空间根目录，由 FastAPI 的 /static 提供；本地 server.mjs 也把 /static 映射到项目根。
const BASE = '/static/';
const FILES = {
  day: 'audio-day.mp3', night: 'audio-night.mp3',
  stamp: 'sfx-stamp.mp3', paper: 'sfx-paper.mp3', pen: 'sfx-pen.mp3',
  lights: 'sfx-lights.mp3', steps: 'sfx-steps.mp3', verdict: 'sfx-verdict.mp3',
};
const VOL = { day: 0.16, night: 0.20, stamp: 0.55, paper: 0.45, pen: 0.35, lights: 0.5, steps: 0.45, verdict: 0.65 };
let muted = false;
try { muted = localStorage.getItem('cage-muted') === '1'; } catch (err) {}
const bg = { day: null, night: null, mode: 'day', started: false, fade: null };

function el(key) {
  const a = new Audio(BASE + FILES[key]);
  a.loop = true;
  a.preload = 'auto';
  a.volume = 0;
  return a;
}
function ensure() {
  if (!bg.day) { bg.day = el('day'); bg.night = el('night'); }
}
function now() { return typeof performance !== 'undefined' ? performance.now() : Date.now(); }
function fade() {
  if (bg.fade) { clearInterval(bg.fade); bg.fade = null; }
  if (!bg.day || muted) return;
  const t0 = now();
  const from = { day: bg.day.volume, night: bg.night.volume };
  const to = { day: bg.mode === 'day' ? VOL.day : 0, night: bg.mode === 'night' ? VOL.night : 0 };
  bg.fade = setInterval(function () {
    const k = Math.min(1, (now() - t0) / 900);
    bg.day.volume = from.day + (to.day - from.day) * k;
    bg.night.volume = from.night + (to.night - from.night) * k;
    if (k >= 1) { clearInterval(bg.fade); bg.fade = null; }
  }, 40);
}
function playBg() {
  ensure();
  [bg.day, bg.night].forEach(function (a) {
    const p = a.play();
    if (p && p.catch) p.catch(function () {});
  });
  bg.started = true;
  fade();
}
function pauseBg() {
  if (bg.fade) { clearInterval(bg.fade); bg.fade = null; }
  [bg.day, bg.night].forEach(function (a) { if (a) a.pause(); });
}
function paintBtn() {
  const b = document.getElementById('mute-btn');
  if (!b) return;
  b.textContent = muted ? '静' : '音';
  b.className = muted ? 'muted' : '';
  b.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
  b.title = muted ? '开启声音' : '关闭声音';
}
function mountBtn() {
  if (document.getElementById('mute-btn')) { paintBtn(); return; }
  const b = document.createElement('button');
  b.id = 'mute-btn';
  b.type = 'button';
  b.addEventListener('click', function (ev) { ev.stopPropagation(); audio.toggle(); });
  (document.getElementById('stage') || document.body).appendChild(b);
  paintBtn();
}
const audio = {
  get muted() { return muted; },
  init() { ensure(); if (!muted) playBg(); },
  setMode(mode) { bg.mode = mode === 'night' ? 'night' : 'day'; ensure(); if (bg.started) fade(); },
  sfx(name) {
    if (muted || !FILES[name]) return;
    try {
      const a = new Audio(BASE + FILES[name]);
      a.volume = VOL[name] || 0.5;
      const p = a.play();
      if (p && p.catch) p.catch(function () {});
    } catch (err) {}
  },
  toggle() {
    muted = !muted;
    try { localStorage.setItem('cage-muted', muted ? '1' : '0'); } catch (err) {}
    if (muted) pauseBg(); else playBg();
    paintBtn();
  },
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountBtn);
else mountBtn();

M["audio"] = {audio:audio};
})();

  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) continue;
    const r = q[i] / p[i];
    if (p[i] < 0) {
      if (r > t1) return null;
      if (r > t0) t0 = r;
    } else {
      if (r < t0) return null;
      if (r < t1) t1 = r;

const doorV = (x, y0, side, floor) => {

  const arc = side > 0
    ? 'M ' + num(x + w) + ' ' + num(y0) + ' A ' + w + ' ' + w + ' 0 0 1 ' + num(x) + ' ' + num(y0 + w)

    line(x, y0, x + side * w, y0, FU, 1.1) +
    path(arc, { stroke: FU2, sw: 0.9 });
};

// 人物档案卡（app.js 会整体移动这两组，所以坐标写成绝对位置、组上只留 id）
// ---------------------------------------------------------------------------
const portrait = (vcx, vcy, kind) => {
  const w = 50, h = 62;
  const x0 = vcx - w / 2, y0 = vcy - h / 2;
  const hx = vcx, hy = y0 + 23;
  const rx = 10, ry = 11.2;
  const s = [];
  // 相纸阴影
  s.push('<rect x="' + num(x0 + 2) + '" y="' + num(y0 + 2.5) + '" width="' + w + '" height="' + h +
    '" fill="#3c2c1a" fill-opacity="0.2" filter="url(#map-card-shadow)"/>');
  // 卡片 + 双层细边框
  s.push(rect(x0, y0, w, h, { fill: CARD, stroke: CARD_LINE, sw: 1.4 }));
  s.push(rect(x0 + 2.4, y0 + 2.4, w - 4.8, h - 4.8, { stroke: CARD_IN, sw: 0.6 }));
  // 头肩线稿
  const face = (outer, inner) => 'M ' + num(outer[0]) + ' ' + num(outer[1]) + ' A ' + num(rx) + ' ' + num(ry) +
    ' 0 0 ' + inner + ' ' + num(outer[2]) + ' ' + num(outer[3]);
  s.push('<ellipse cx="' + num(hx) + '" cy="' + num(hy) + '" rx="' + rx + '" ry="' + ry +
    '" fill="none" stroke="' + CARD_LINE + '" stroke-width="1.3"/>');
  if (kind === 'prisoner') {
    // 平头：帽盖 + 竖向发茬高光
    s.push(path('M ' + num(hx - rx) + ' ' + num(hy) + ' A ' + rx + ' ' + ry + ' 0 0 1 ' +
      num(hx + rx) + ' ' + num(hy), { fill: HAIR, stroke: 'none' }));
    for (const sxx of [-7, -4.5, -2, 0.5, 3, 5.5, 8]) {
      s.push(line(hx + sxx, hy - ry + 1.5, hx + sxx + 0.8, hy - ry + 8, CARD, 0.55));
    }
  } else {
    // 军帽：帽筒 + 帽檐 + 帽徽
    s.push(rect(hx - rx - 2, hy - ry - 3.2, (rx + 2) * 2, ry * 0.68 + 3.2,
      { fill: FU, stroke: CARD_LINE, sw: 1.0 }));
    s.push(line(hx - rx - 4, hy - ry * 0.32, hx + rx + 4, hy - ry * 0.32, CARD_LINE, 1.6));
    s.push(line(hx - rx - 2, hy - ry - 3.2, hx + rx + 2, hy - ry - 3.2, CARD_LINE, 0.9));
    s.push(ell(hx - 2.2, hy - ry + 1.2, 4.4, 4.4, { stroke: CARD, sw: 0.8 }));
  }
  // 耳朵
  s.push(line(hx - rx - 1.2, hy + 2, hx - rx + 1.2, hy + 4, CARD_LINE, 0.9));
  s.push(line(hx + rx - 1.2, hy + 2, hx + rx + 1.2, hy + 4, CARD_LINE, 0.9));
  if (kind === 'prisoner') {
    for (const sxx of [-4.5, -2.2, 0, 2.2, 4.5]) s.push(line(hx + sxx, hy + 9.2, hx + sxx, hy + 10.6, STUBBLE, 0.5));
  }
  // 眉眼嘴
  s.push(line(hx - 4.6, hy + 1.4, hx - 2.0, hy + 1.4, CARD_LINE, 1.1));
  s.push(line(hx + 2.0, hy + 1.4, hx + 4.6, hy + 1.4, CARD_LINE, 1.1));
  s.push(line(hx - 1.8, hy + 6.2, hx + 1.8, hy + 6.2, CARD_LINE, 0.8));
  // 肩线 + 肩弧
  s.push(line(hx - 3.6, hy + ry * 0.95, hx - 4.6, y0 + h - 14, CARD_LINE, 1.0));
  s.push(line(hx + 3.6, hy + ry * 0.95, hx + 4.6, y0 + h - 14, CARD_LINE, 1.0));
  s.push(path('M ' + num(hx - 19.33) + ' ' + num(y0 + 57 - 7.42) +
    ' A 21 19 0 0 1 ' + num(hx + 19.33) + ' ' + num(y0 + 57 - 7.42),
    { stroke: CARD_LINE, sw: 1.2 }));
  if (kind === 'prisoner') {
    // 囚服 V 领
    s.push(line(hx - 6, y0 + h - 13, hx, y0 + h - 6, CARD_LINE, 0.9));
    s.push(line(hx + 6, y0 + h - 13, hx, y0 + h - 6, CARD_LINE, 0.9));
  }
  return s.join('');
};

function simulateNight(state, choice = {}) {

  if (state.tutorialPending) push(t, 'note', '这是第一夜。他还在摸这间屋子。');

  const done = (state.progress && state.progress.routeId === route.id) ? state.progress.done : 0;

  }

  let lastRoom = null;
  let lastBlk = null;
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];

      }
      continue;
    }

    const blk = state.rules.find(r => ruleBlocks(r, { ...step, act:'MOVE' }, t)) ||
                state.rules.find(r => ruleBlocks(r, step, t));

      state.grudge[blk.id] = (state.grudge[blk.id] || 0) + 1;

      }

    }

      const cp = Math.min(0.9, PARAMS.catchBase + PARAMS.catchObedience * state.obedience / 100
        + (warnedNow ? PARAMS.catchWarned : 0) + state.fatigue * PARAMS.catchFatigue);
      if (rng() < cp) {
        const blind = state.obedience < 40;
        push(t, 'catch', blind ? '手电的光扫过来。狱警看了他一眼，把光挪开了。' : '手电筒的光扫过来。狱警抓住了他的胳膊。');

        if (!blind) { carried.clear(); state.progress = null; }

      }
    }

    if (step.act === 'TAKE') carried.add(step.item);
    push(t, 'done', '他' + step.label + '。');
    state.progress = { routeId: route.id, done: done + i + 1 };

  state.prisoner.items = [...carried];
  state.tutorialPending = false;

  else {

  state.warned = false;   // 夜巡用完即止
  state.prediction = null;

  return { route, outcome, events, predictedRight:right };
}

  const broad = l.zones === 'ALL' || (l.window.from === 0 && l.window.to === 1439);
  return broad
    ? '这条规矩管得太宽了。狱警会照办，但不会认真照办——服从度会掉得更快。'
    : '这条规矩写得很具体。具体就意味着他真的会去执行。';
}

// ---------- 预判 + 入夜 ----------
async function askNight() {
  if (busy) return;
  if (g.day === 5 && !wroteToday) return toast('今晚上级检查：你必须再写一条规矩。');
  const holes = E.enumerateHoles(g);
  const sheet = openSheet(
    '<h3>今 夜 他 会 试 哪 条 路</h3>' +
    '<p class="sub">没查过的路只能赌。猜中：明天多 1 点行动力，狱警也会多站一班</p>' +
    '<p class="hint">档案：' + esc(g.habit ? g.habit.line : '') + '</p>' +
    '<div class="chips">' + E.availableRoutes(g).map((r) => {
      const hole = holes.find((h) => h.id === r.id) || {};
      const detail = hole.known
        ? (hole.open ? '这条路是通的' : '卡在：' + (hole.blockedAt || '') + (hole.strength < 0.6 ? '（拦得不稳）' : ''))
        : '没查过这条路';
      return '<div class="chip" data-k="pred" data-id="' + r.id + '"><div><div class="nm">' + r.name +
        '</div><div class="in" style="' + (hole.known ? '' : 'opacity:.5') + '">' + detail + '</div></div></div>';
    }).join('') + '</div>' +
    '<div class="row stack"><button class="btn ghost" data-k="interrogate">提审他 · 1 行动力</button>' +
    '<button class="btn ghost" data-k="patrol">加派夜巡 · 2 行动力</button></div>' +
    '<div class="row"><button class="btn ghost" data-k="skip">不猜，直接入夜</button></div>'
  );
  sheet.addEventListener('click', async (ev) => {
    const el = ev.target.closest ? ev.target.closest('.chip') : null;
    const k = ev.target.dataset && ev.target.dataset.k;
    if (el) { closeSheet(); E.predict(g, el.dataset.id); runNight(); return; }
    if (k === 'skip') { closeSheet(); runNight(); return; }
    if (k === 'interrogate' || k === 'patrol') {
      const r = k === 'interrogate' ? E.interrogate(g) : E.extraPatrol(g);
      if (!r.ok) return toast(r.error);
      closeSheet();
      syncView();
      await paint();
      const nm = r.route ? '「' + r.route.name + '」' : '一条你已经知道的路';
      toast(k === 'interrogate' ? '他交代了：' + nm : '夜巡回报：他最近在看' + nm);
      askNight();
    }
  });
}

async function runNight() {
  busy = true;
  const holes = E.enumerateHoles(g);
  // AI 的「决定」：引擎先把所有真实漏洞算清，LLM 只能在这张清单里挑一条最像人的；
  // 挑完仍由引擎逐条校验、执行。关掉 AI（?llm=0）就退回「第一条最松的路」，这就是 ablation。
  // 与动画并行：让 AI 挑路线的时间藏在「熄灯 + 画夜路」的 2 秒里
  const pickP = chooseHole(holes, g).catch(() => null);
  const guess = holes[0].id;
  const route0 = E.availableRoutes(g).find((r) => r.id === guess) || E.ROUTES[1];
  view.phase = 'night'; syncView();
  audio.setMode('night'); audio.sfx('lights');
  setTimeout(function () { audio.sfx('steps'); }, 900 * SPEED);
  view.path = await pathFor(route0);
  view.report = [];
  await paint();
  await wait(2100);
  const pick = await pickP;
  aiStat.picks += 1;
  if (pick && pick.by === 'llm') aiStat.picksLLM += 1;
  const actual = (pick && pick.id) || guess;
  const route = E.availableRoutes(g).find((r) => r.id === actual) || E.ROUTES[1];
  if (actual !== guess && route !== route0) {
    view.path = await pathFor(route);
    await paint();
    await wait(900);
  }

  const res = E.simulateNight(g, { routeId: actual });
  // AI 只写「他今晚的样子」这一句。判定、路线、结局全在引擎里，AI 没有权限改任何数值。
  // 与逐条打印并行：打印完它刚好回来，不额外等；关掉 AI 或超时就用模板句。
  const blk = res.events.find((e) => e.kind === 'block');
  const remarkP = remark(g, {
    routeName: res.route.name, outcome: res.outcome, blocked: blk ? blk.text : '',
  }).catch(() => null);
  const live = stage.querySelector('#report-live');
  let y = 792;
  for (const ev of res.events) {
    if (y > 906) break;
    appendLine(live, ev, y);
    y += ev.kind === 'escape' ? 34 : 30;
    await wait(ev.kind === 'escape' ? 1100 : 760);
  }
  // 这句话永远要有：AI 慢就先落一句模板，AI 回来后原地换掉 —— 玩家不需要等任何人。
  const rk = await Promise.race([remarkP, wait(7500).then(() => null)]);
  const noteEl = y <= 912 ? appendLine(live, { t: '', text: (rk && rk.line) || localNightLine(res.outcome), kind: 'note', id: 'remark-line' }, y) : null;
  aiStat.lines += 1;
  if (rk && rk.line && rk.by === 'llm') aiStat.linesLLM += 1;
  if (noteEl && (!rk || rk.by !== 'llm')) {
    remarkP.then(function (late) {
      if (!late || !late.line || late.by !== 'llm') return;
      const t2 = noteEl.querySelectorAll('text');
      if (t2.length > 1) t2[1].textContent = Array.from(late.line).slice(0, 42).join('');
      aiStat.linesLLM += 1;
    }).catch(function () {});
  }
  await wait(1100);
  busy = false;
  if (g.escaped || g.nights.length >= g.maxDays) await showSettle();
  else { audio.setMode('day'); dayBriefing(); await paint(); if (g.day === 6) askSick(); }
}

function appendLine(live, ev, y) {
  if (!live) return null;
  const NS = 'http://www.w3.org/2000/svg';
  // 版式换算：桌面版直接用屏幕坐标；手机版由 #report-live 的 data-cfg 折算（同一套打字逻辑）
  let cfg = null;
  try { const raw = live.getAttribute && live.getAttribute('data-cfg'); if (raw) cfg = JSON.parse(raw); } catch (err) {}
  const k = cfg ? cfg.k : 1;
  const Y = cfg ? cfg.y0 + (y - 792) * k : y;
  const X1 = cfg ? cfg.x1 : 252, X2 = cfg ? cfg.x2 : 306;
  const FS = cfg ? cfg.fs : null;
  const COLS = cfg ? cfg.cols : 42;
  const color = { block:'#882e1f', leak:'#882e1f', catch:'#544a3c', escape:'#882e1f', event:'#80603c', note:'#7e6f5c' }[ev.kind] || '#40372d';
  const font = ev.kind === 'event' || ev.kind === 'note' ? 'KaiTi' : 'SimSun';
  const chars = Array.from(ev.text);
  const rows = [];
  for (let i = 0; i < chars.length; i += COLS) rows.push(chars.slice(i, i + COLS).join(''));
  const box = document.createElementNS(NS, 'g');
  const t0 = document.createElementNS(NS, 'text');
  t0.setAttribute('x', String(X1)); t0.setAttribute('y', String(Y));
  t0.setAttribute('font-size', String(FS ? Math.round(FS * 0.72) : 12)); t0.setAttribute('fill', '#7e6f5c');
  t0.setAttribute('letter-spacing', '0.5'); t0.textContent = ev.t || '';
  box.appendChild(t0);
  rows.slice(0, 2).forEach((row, i) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', String(X2)); t.setAttribute('y', String(Y + (cfg ? i * FS * 1.3 : i * 21)));
    t.setAttribute('font-size', String(FS || (ev.kind === 'event' ? 14 : 15.5)));
    t.setAttribute('font-family', font);
    t.setAttribute('fill', i ? '#7e6f5c' : color);
    t.textContent = row;
    box.appendChild(t);
  });
  if (ev.id) box.setAttribute('id', ev.id);
  live.appendChild(box);
  return ev.id ? box : null;
}

// AI 慢的时候先落这一句，保证「夜里总有人说话」
function localNightLine(outcome) {
  if (outcome === 'escape') return '门开着，风是从外面进来的。';
  if (outcome === 'caught') return '他被按住的时候没有挣扎，只是看着灯。';
  if (outcome === 'slip') return '灯挪开了。他站在原地没动。';
  if (outcome === 'blocked') return '他在门口站了一会儿，把手插回兜里。';
  return '他把床板翻过来，又翻了回去。';
}

// ---------- 第 6 天：他病了 ----------
function askSick() {
  const sheet = openSheet(
    '<h3>他 病 了</h3>' +
    '<p class="sub">他在医务室躺了一整天</p>' +
    '<div class="chips" style="grid-template-columns:1fr">' +
    '<div class="chip" data-k="sick" data-id="treat"><div><div class="nm">叫医生来</div><div class="in">信任 +12 · 服从度 +6</div></div></div>' +
    '<div class="chip" data-k="sick" data-id="ignore"><div><div class="nm">扣下他今天的行动</div><div class="in">他今天动不了 · 服从度 −4 · 他会记住这一笔</div></div></div>' +
    '</div>'
  );
  sheet.addEventListener('click', (ev) => {
    const el = ev.target.closest ? ev.target.closest('.chip') : null;
    if (!el) return;
    E.sickChoice(g, el.dataset.id);
    closeSheet();
    syncView();
    view.report = [{ t:'处置', text: el.dataset.id === 'treat' ? '你叫了医生。' : '你把他关在里面，什么也没给他。' }];
    paint();
  });
}

// ---------- 结算 ----------
async function showSettle() {
  audio.setMode('day'); audio.sfx('verdict');
  const s = E.settle(g);
  syncView();
  view.phase = 'settle'; view.path = null;
  view.settle = { title: s.title, sub: s.sub, quote: s.quote };
  view.settleStats = {
    days: '坚 持 了 ' + Math.min(g.nights.length, 7) + ' 天',
    obedience: Math.round(g.obedience), hostility: Math.round(g.hostility),
    ai: 'AI ‖ 挑路 ' + aiStat.picksLLM + '/' + aiStat.picks + ' 夜 · 开口 ' + aiStat.linesLLM + '/' + aiStat.lines + ' 次',
  };
  view.report = [];
  await paint();
}

// ---------- 点击 ----------
document.addEventListener('click', (ev) => {
  const el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'start' || act === 'again') { audio.init(); audio.sfx('stamp'); newGame(); return; }
  if (act === 'write') askWrite();
  if (act === 'night') askNight();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeSheet();
  // 封面支持回车 / 空格开始
  if (view && view.phase === 'cover' && (ev.key === 'Enter' || ev.key === ' ')) {
    ev.preventDefault(); audio.init(); audio.sfx('stamp'); newGame();
  }
});
// 手机 ↔ 桌面切换（旋转屏幕 / 拉伸窗口）时换版式重画
let __wasMobile = isMobileView();
window.addEventListener('resize', () => {
  const now = isMobileView();
  if (now !== __wasMobile) { __wasMobile = now; paint(); }
});

// 首次交互解锁音频（浏览器不允许页面加载即播放）；封面点击也会走这里
document.addEventListener('pointerdown', function () { audio.init(); }, { once: true, capture: true });
// ?intro=0 跳过封面（自动化测试与录屏用）；默认先显示进入界面
if (/[?&]intro=0/.test(location.search)) newGame(); else showCover();
warm();   // 预热语言模型，别让第一条规矩撞上冷启动
window.__game = { get g() { return g; }, get view() { return view; }, newGame, showCover, E, showSettle, askNight, askWrite };
window.__audio = audio;
M["app"] = {};
})();

})();
</script>
